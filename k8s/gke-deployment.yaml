apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-telemetry-mlops-inference
  labels:
    app: iot-telemetry-mlops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iot-telemetry-mlops
  template:
    metadata:
      labels:
        app: iot-telemetry-mlops
    spec:
      containers:
        - name: inference-server
          image: us-central1-docker.pkg.dev/cloud-mlops-iot-prod/ml-models/iot-telemetry-mlops:v1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
